site_name: RAPTOR
site_description: >-
  RAPTOR (Rapid Algorithm for Pseudospectral Trajectory Optimization and
  Robustification) is an object-oriented MATLAB toolbox for solving
  continuous-time optimal control problems with pseudospectral collocation.
site_author: Riccardo Minnozzi

# Public solver repository (used by the header link, the footer icon and
# the home page buttons)
repo_url: https://github.com/raptor-solver/raptor-matlab
repo_name: raptor-matlab
edit_uri: ""

site_url: https://raptor-solver.github.io/

copyright: Copyright &copy; 2026 Riccardo Minnozzi

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/icon_raptor.svg
  favicon: assets/icon_raptor.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/raptor-solver/raptor-matlab
      name: RAPTOR on GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:riccardo.minnozzi@unibo.it
      name: Contact the developers

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Core Concepts: getting-started/concepts.md
      - Vectorized Functions: getting-started/vectorized-functions.md
  - User Guide:
      - user-guide/index.md
      - Modelling:
          - Problems and Phases: user-guide/problems-and-phases.md
          - Dynamics and Costs: user-guide/dynamics-and-costs.md
          - Bounds and Boundary Conditions: user-guide/bounds-and-boundary-conditions.md
          - Constraints: user-guide/constraints.md
          - Initial Guess: user-guide/initial-guess.md
          - Collocation: user-guide/collocation.md
          - Multi-Phase Problems: user-guide/multi-phase.md
      - Solving:
          - Numerical Setup: user-guide/numerical-setup.md
          - NLP Solvers: user-guide/nlp-solvers.md
      - Results:
          - Solution and Validation: user-guide/results.md
          - Troubleshooting: user-guide/troubleshooting.md
  - Examples: examples.md
  - Cite: citing.md

plugins:
  - search

validation:
  links:
    anchors: warn
